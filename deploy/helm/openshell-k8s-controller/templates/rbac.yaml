{{- $fullname := include "openshell-k8s-controller.fullname" . }}
{{- $watch := include "openshell-k8s-controller.watchNamespace" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}
  namespace: {{ $watch }}
  labels:
    {{- include "openshell-k8s-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: ["openshell.ai"]
    resources: ["openshellsandboxes", "openshellproviders"]
    verbs: ["list", "watch", "patch"]
  - apiGroups: ["openshell.ai"]
    resources: ["openshellsandboxtemplates"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["openshell.ai"]
    resources:
      - openshellsandboxes/status
      - openshellsandboxtemplates/status
      - openshellproviders/status
    verbs: ["patch"]
  # Providers reference credentials in Secrets. The controller reads them and
  # sends their values to the gateway; it never writes Secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}
  namespace: {{ $watch }}
  labels:
    {{- include "openshell-k8s-controller.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "openshell-k8s-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}
{{- if .Values.leaderElection.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-k8s-controller.labels" . | nindent 4 }}
rules:
  # Create can't be limited by name; the controller creates only its own Lease.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ $fullname | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-k8s-controller.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "openshell-k8s-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-leader-election
{{- end }}
