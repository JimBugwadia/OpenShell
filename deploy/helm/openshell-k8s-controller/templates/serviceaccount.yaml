{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openshell-k8s-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-k8s-controller.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
