apiVersion: v1
kind: ServiceAccount
metadata:
  name: openshell-k8s-controller
  namespace: openshell-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openshell-k8s-controller
  namespace: openshell-sandbox
rules:
  - apiGroups: ["openshell.ai"]
    resources: ["openshellsandboxes"]
    verbs: ["list", "watch", "patch"]
  - apiGroups: ["openshell.ai"]
    resources: ["openshellsandboxtemplates"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["openshell.ai"]
    resources: ["openshellproviders"]
    verbs: ["list", "watch", "patch"]
  - apiGroups: ["openshell.ai"]
    resources:
      - "openshellsandboxes/status"
      - "openshellsandboxtemplates/status"
      - "openshellproviders/status"
    verbs: ["patch"]
  # Providers reference credentials in Secrets. The controller reads them and
  # sends their values to the gateway; it never writes Secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshell-k8s-controller
  namespace: openshell-sandbox
subjects:
  - kind: ServiceAccount
    name: openshell-k8s-controller
    namespace: openshell-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openshell-k8s-controller
