apiVersion: openshell.ai/v1alpha1
kind: OpenShellSandbox
metadata:
  name: worker
  namespace: team-b
  labels:
    app: openshell-template-demo
spec:
  workloadTemplate: ubuntu-demo
  command:
    - /bin/sh
    - -c
    - printf '%s\n' "$DEMO_MESSAGE" > /sandbox/demo-marker; exec sleep infinity
  restartPolicy: Never
  desiredState: Running
